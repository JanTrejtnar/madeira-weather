name: Update forecast

on:
  schedule:
    # cron běží v UTC; Madeira je WET (UTC+0) v zimě a WEST (UTC+1) v létě.
    # GitHub plánované běhy zpožďuje (i o hodiny) a občas vynechá, proto je rozvrh záměrně hustý:
    # výpadek jednoho běhu pokryje další, nikdy ne celé ráno. Minuty mimo :00 kvůli špičce fronty.
    - cron: "25 0 * * *"   # po půlnoci Madeiry: přepnutí dne, včerejšek do historie
    - cron: "15 7 * * *"   # ráno v létě: 08:15 WEST – čerstvý ranní snímek 08:00 (v zimě 07:15 WET)
    - cron: "15 8 * * *"   # ráno v zimě: 08:15 WET – čerstvý ranní snímek 08:00 (v létě 09:15 WEST)
    - cron: "45 9 * * *"   # dopoledne: východ je vyhodnocený, záloha za ranní běhy
    - cron: "20 12 * * *"  # poledne: aktualizace předpovědi na odpoledne a západ
    - cron: "30 14 * * *"  # odpoledne: 15:30 WEST – Fanal po 15:00, zpřesnění večerního západu
    - cron: "50 17 * * *"  # před západem: poslední zpřesnění a snímek západu
    - cron: "15 20 * * *"  # večer: 21:15 WEST – po západu, předpověď na zítřek
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Export web data
        run: madeira export-web

      - name: Export map data
        run: madeira export-map

      - name: Commit and push if changed
        if: ${{ !cancelled() }}  # i při selhání mapy se uloží, co se podařilo vyexportovat
        run: |
          if git diff --quiet -- docs/data.json docs/map_data.json docs/story-latest.png docs/og-preview.png; then
            echo "No changes in docs/data.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/map_data.json docs/story-latest.png docs/og-preview.png
          git commit -m "Update forecast data"
          git push
