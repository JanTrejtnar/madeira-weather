<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Madeira Sunny Escape</title>
  <meta name="description" content="Kam dnes na Madeiře vyrazit za sluncem / Where to chase the sun on Madeira today.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jantrejtnar.github.io/madeira-weather/escape.html">
  <meta property="og:title" content="Madeira Sunny Escape · Kde dnes svítí slunce?">
  <meta property="og:description" content="Srovnání pobřežních měst na Madeiře. Zjistěte, kam dnes utéct před deštěm a mraky.">
  <meta property="og:image" content="https://jantrejtnar.github.io/madeira-weather/og-preview.png">
  <meta property="og:image" content="./og-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Madeira Sunny Escape · Kde dnes svítí slunce?">
  <meta name="twitter:description" content="Srovnání pobřežních měst na Madeiře. Zjistěte, kam dnes utéct před deštěm a mraky.">
  <meta name="twitter:image" content="https://jantrejtnar.github.io/madeira-weather/og-preview.png">
  <meta name="twitter:image" content="./og-preview.png">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MadeiraSky">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: radial-gradient(120% 60% at 50% 0%, rgba(251,191,36,.18), transparent 60%),
                       linear-gradient(180deg, #0f172a 0%, #1c1917 100%) fixed; }
    .seg-on { background: rgba(251,191,36,.2); color: #fde68a; }
    .seg-off { color: #94a3b8; }
    .seg-off:hover { background: rgba(255,255,255,.1); }
    /* mobil: navigace jako spodní tab bar přilepený ke spodku obrazovky */
    @media (max-width: 639px) {
      #mainnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1300; margin: 0; border-radius: 0; border-width: 1px 0 0;
                 padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: rgba(10,10,10,.94); }
      body { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased">
  <main class="mx-auto max-w-2xl px-4 py-8 sm:py-12" style="padding-top:max(2rem,env(safe-area-inset-top));padding-bottom:max(2rem,env(safe-area-inset-bottom))">
    <div class="mb-4 flex items-center justify-between gap-4">
      <p class="text-sm uppercase tracking-widest text-amber-300/80">Madeira</p>
      <div id="lang" class="flex shrink-0 overflow-hidden rounded-xl border border-white/15 text-sm" role="group" aria-label="Language">
          <button type="button" data-lang="cs" class="inline-flex items-center gap-1.5 px-3 py-1.5" aria-label="Čeština"><img src="flag-cz.svg" alt="" width="20" height="14" class="h-3.5 w-5 rounded-[2px]">CZ</button>
          <button type="button" data-lang="en" class="inline-flex items-center gap-1.5 px-3 py-1.5" aria-label="English"><img src="flag-gb.svg" alt="" width="20" height="14" class="h-3.5 w-5 rounded-[2px]">EN</button>
        </div>
    </div>
    <nav id="mainnav" class="mb-6 grid grid-cols-5 gap-1 rounded-2xl border border-neutral-800 bg-neutral-900/80 p-1 backdrop-blur-md" aria-label="Navigation">
      <a href="./index.html" data-nav="sun" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm text-neutral-400 hover:text-white hover:bg-white/5"><span aria-hidden="true" class="text-base leading-none">🌅</span><span data-nav-label>Golden Hour</span></a>
      <a href="./escape.html" data-nav="escape" aria-current="page" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm bg-neutral-800 text-white ring-1 ring-white/15 shadow-[0_0_14px_rgba(255,255,255,.08)]"><span aria-hidden="true" class="text-base leading-none">☀️</span><span data-nav-label>Sunny Escape</span></a>
      <a href="./fanal.html" data-nav="fanal" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm text-neutral-400 hover:text-white hover:bg-white/5"><span aria-hidden="true" class="text-base leading-none">🌫️</span><span data-nav-label>Mlžný Fanal</span></a>
      <a href="./webcams.html" data-nav="cams" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm text-neutral-400 hover:text-white hover:bg-white/5"><span aria-hidden="true" class="text-base leading-none">📷</span><span data-nav-label>Webkamery</span></a>
      <a href="./map.html" data-nav="map" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm text-neutral-400 hover:text-white hover:bg-white/5"><span aria-hidden="true" class="text-base leading-none">🗺️</span><span data-nav-label>Mapa</span></a>
    </nav>

    <header class="mb-6 flex items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold sm:text-3xl">Sunny Escape</h1>
        <p id="note" class="mt-1 text-sm text-slate-400"></p>
      </div>
      <div id="days" class="hidden shrink-0 overflow-hidden rounded-xl border border-white/15 text-sm" role="group"></div>
    </header>

    <div id="state" class="rounded-2xl bg-white/5 p-6 text-slate-300" role="status"></div>

    <section id="content" class="hidden space-y-4">
      <article class="rounded-3xl border border-amber-300/30 bg-amber-300/10 p-6 shadow-xl backdrop-blur sm:p-8">
        <p id="hero-kicker" class="text-xs uppercase tracking-widest text-amber-200/80"></p>
        <h2 id="hero-title" class="mt-1 text-2xl font-bold text-amber-100 sm:text-3xl"></h2>
        <div class="mt-6 flex items-center gap-5">
          <span id="hero-icon" class="text-7xl leading-none sm:text-8xl" aria-hidden="true"></span>
          <div>
            <p id="hero-temp" class="text-6xl font-bold leading-none text-amber-100 sm:text-7xl"></p>
            <p id="hero-sky" class="mt-2 text-slate-200"></p>
          </div>
        </div>
        <dl class="mt-6 grid grid-cols-3 gap-2 text-center sm:gap-3">
          <div class="min-w-0 rounded-2xl bg-black/20 px-1.5 py-3 sm:px-3">
            <dt id="h-rain" class="text-[11px] leading-tight text-slate-400 sm:text-xs"></dt>
            <dd id="hero-rain" class="mt-1 text-lg font-semibold sm:text-xl"></dd>
          </div>
          <div class="min-w-0 rounded-2xl bg-black/20 px-1.5 py-3 sm:px-3">
            <dt id="h-cloud" class="text-[11px] leading-tight text-slate-400 sm:text-xs"></dt>
            <dd id="hero-cloud" class="mt-1 text-lg font-semibold sm:text-xl"></dd>
          </div>
          <div class="min-w-0 rounded-2xl bg-black/20 px-1.5 py-3 sm:px-3">
            <dt id="h-sun" class="text-[11px] leading-tight text-slate-400 sm:text-xs"></dt>
            <dd id="hero-sun" class="mt-1 text-lg font-semibold text-amber-200 sm:text-xl"></dd>
          </div>
        </dl>
        <p id="hero-tip" class="mt-5 text-slate-200"></p>
      </article>

      <div>
        <h2 id="others-title" class="mb-2 mt-6 text-sm uppercase tracking-widest text-slate-400"></h2>
        <ul id="others" class="space-y-2"></ul>
      </div>
    </section>

    <footer class="mt-10 text-xs text-slate-500">
      <p id="updated"></p>
      <p id="disclaimer" class="mt-1"></p>
    </footer>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const T = {
    cs: {
      loading: "Načítám předpověď…",
      note: (w) => `Nejslunnější pobřeží, ${w[0]}:00–${w[1]}:00`,
      today: "Dnes", tomorrow: "Zítra", kicker: "Doporučení", others: "Ostatní místa",
      title: (w, d) => `🏆 ${d === "today" ? "Dnes" : "Zítra"} jeďte do ${w.name_gen || w.name}`,
      rain: "Srážky", cloud: "Oblačnost", sun: "Slunečnost",
      sky: { clear: "Jasno", partly: "Polojasno", cloudy: "Zataženo", rain: "Déšť" },
      dry: "0 mm", dryShort: "bez deště", mm: (v) => `${v} mm`,
      tip: (w, d) => w.sun_score >= 70 ? (w.precip_mm > 0 ? "Převážně slunečno, jen s občasnou přeháňkou." : "Slunečno a sucho – tady to vyhrává.")
        : w.sun_score >= 40 ? "Bude to spíš proměnlivé, ale pořád nejlepší z nabídky." : "Nikde to dnes nevypadá na pláž – tohle je nejlepší z horšího.",
      nodata: "Data o slunečnosti zatím nejsou k dispozici.",
      error: "Předpověď se nepodařilo načíst", retry: "Zkus to prosím později.",
      updated: "Naposledy aktualizováno", stale: "data jsou starší než den!",
      disclaimer: "Model: Open-Meteo. Orientační předpověď, ne záruka; před odjezdem zkontroluj aktuální stav.",
    },
    en: {
      loading: "Loading forecast…",
      note: (w) => `Sunniest coastal spot, ${w[0]}:00–${w[1]}:00`,
      today: "Today", tomorrow: "Tomorrow", kicker: "Recommendation", others: "Other places",
      title: (w, d) => `🏆 Head to ${w.name} ${d === "today" ? "today" : "tomorrow"}`,
      rain: "Rain", cloud: "Clouds", sun: "Sunshine",
      sky: { clear: "Clear", partly: "Partly cloudy", cloudy: "Overcast", rain: "Rain" },
      dry: "0 mm", dryShort: "no rain", mm: (v) => `${v} mm`,
      tip: (w, d) => w.sun_score >= 70 ? (w.precip_mm > 0 ? "Mostly sunny, with just the odd shower." : "Sunny and dry – this is the winner.")
        : w.sun_score >= 40 ? "Changeable, but still the best on offer." : "No beach weather anywhere today – this is the least bad.",
      nodata: "Sunshine data is not available yet.",
      error: "Could not load the forecast", retry: "Please try again later.",
      updated: "Last updated", stale: "data is more than a day old!",
      disclaimer: "Model: Open-Meteo. Indicative forecast, not a guarantee; check current conditions before you leave.",
    },
  };
  const SKY_ICON = { clear: "☀️", partly: "🌤", cloudy: "☁️", rain: "🌧" };

  let lang = "", data = null, day = null;
  try { lang = localStorage.getItem("lang") || ""; } catch (e) {}
  if (!T[lang]) lang = (navigator.language || "cs").toLowerCase().startsWith("cs") ? "cs" : "en";
  const NAV = { cs: { sun: "Golden Hour", escape: "Sunny Escape", fanal: "Mlžný Fanal", cams: "Webkamery", map: "Mapa" }, en: { sun: "Golden Hour", escape: "Sunny Escape", fanal: "Misty Fanal", cams: "Webcams", map: "Map" } };
  const applyNav = (l) => document.querySelectorAll("#mainnav [data-nav]").forEach((a) => { a.querySelector("[data-nav-label]").textContent = NAV[l][a.dataset.nav]; });
  const t = () => T[lang];
  const locale = () => (lang === "cs" ? "cs-CZ" : "en-GB");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const mm = (v) => (v == null ? "–" : v === 0 ? t().dry : t().mm(v.toLocaleString(locale())));
  const pct = (v) => (v == null ? "–" : `${v} %`);

  function current() {
    const se = data && data.sunny_escape;
    if (!se) return null;
    if (!day || !se[day]) day = se.day && se[se.day] ? se.day : ["today", "tomorrow"].find((k) => se[k]);
    return day ? { se, d: se[day] } : null;
  }

  function render() {
    const L = t(), cur = current();
    document.documentElement.lang = lang;
    applyNav(lang);
    $("disclaimer").textContent = L.disclaimer;
    document.querySelectorAll("#lang button").forEach((b) => {
      const on = b.dataset.lang === lang;
      b.setAttribute("aria-pressed", on);
      b.className = "inline-flex items-center gap-1.5 px-3 py-1.5 " + (on ? "seg-on" : "seg-off");
    });
    if (!data) { $("state").textContent = L.loading; return; }
    if (data.generated_at) {
      const g = new Date(data.generated_at), stale = (Date.now() - g.getTime()) / 36e5 > 24;
      $("updated").textContent = `${L.updated}: ${g.toLocaleString(locale(), { dateStyle: "medium", timeStyle: "short", timeZone: "Atlantic/Madeira" })}` + (stale ? ` – ${L.stale}` : "");
      $("updated").className = stale ? "text-amber-400" : "";
    }
    if (!cur) {
      $("content").classList.add("hidden");
      $("state").classList.remove("hidden");
      $("state").textContent = L.nodata;
      return;
    }
    $("state").classList.add("hidden");
    $("content").classList.remove("hidden");

    const { se, d } = cur, w = d.winner, wr = d.locations.find((r) => r.key === w.key) || {};
    $("note").textContent = L.note(se.window || [11, 16]);
    const keys = ["today", "tomorrow"].filter((k) => se[k]);
    $("days").classList.toggle("hidden", keys.length < 2);
    $("days").classList.toggle("flex", keys.length >= 2);
    $("days").replaceChildren(...keys.map((k) => {
      const b = el("button", "px-3 py-1.5 " + (k === day ? "seg-on" : "seg-off"), L[k]);
      b.type = "button";
      b.setAttribute("aria-pressed", k === day);
      b.addEventListener("click", () => { day = k; render(); });
      return b;
    }));

    $("hero-kicker").textContent = L.kicker;
    $("hero-title").textContent = L.title(w, day);
    $("hero-icon").textContent = SKY_ICON[w.sky] || "☀️";
    $("hero-temp").textContent = w.temp_c == null ? "–" : `${w.temp_c} °C`;
    $("hero-sky").textContent = L.sky[w.sky] || "";
    $("h-rain").textContent = L.rain;
    $("h-cloud").textContent = L.cloud;
    $("h-sun").textContent = L.sun;
    $("hero-rain").textContent = mm(w.precip_mm);
    $("hero-cloud").textContent = pct(wr.cloud_pct);
    $("hero-sun").textContent = pct(w.sun_score);
    $("hero-tip").textContent = L.tip(w, day);

    $("others-title").textContent = L.others;
    $("others").replaceChildren(...d.locations.filter((r) => r.key !== w.key).map((r) => {
      const li = el("li", "rounded-2xl border border-white/10 bg-white/5 p-4");
      const head = el("div", "flex items-center justify-between gap-3");
      head.append(el("p", "min-w-0 truncate font-semibold", `${SKY_ICON[r.sky] || ""} ${r.name}`),
        el("p", "shrink-0 text-lg font-bold text-amber-200", pct(r.sun_score)));
      const bar = el("div", "mt-2 h-1.5 overflow-hidden rounded-full bg-white/10");
      const fill = el("div", "h-full rounded-full bg-amber-400");
      fill.style.width = `${Math.max(0, Math.min(100, r.sun_score))}%`;
      bar.append(fill);
      const stats = el("p", "mt-2 text-sm text-slate-300",
        `${r.temp_c == null ? "–" : r.temp_c + " °C"} · ${L.cloud} ${pct(r.cloud_pct)} · ${r.precip_mm ? `${L.rain} ${mm(r.precip_mm)}` : L.dryShort}`);
      li.append(head, bar, stats);
      return li;
    }));
  }

  document.querySelectorAll("#lang button").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch (e) {}
    render();
  }));
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }

  fetch("./data.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then((d) => { data = d; render(); })
    .catch((e) => {
      $("state").textContent = `${t().error} (${e.message}). ${t().retry}`;
      $("state").className = "rounded-2xl bg-rose-500/10 p-6 text-rose-200 ring-1 ring-rose-400/30";
    });
})();
</script>
</body>
</html>
