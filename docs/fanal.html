    .mist { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-3%); opacity: .55; } to { transform: translateX(3%); opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .mist { animation: none; } }

      #mainnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1300; margin: 0; border-radius: 0; border-width: 1px 0 0;
                 padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: rgba(10,10,10,.94); }
      body { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }

</head>
<body class="min-h-screen text-slate-100 antialiased">
  <main class="mx-auto max-w-3xl px-4 py-8 sm:py-12" style="padding-top:max(2rem,env(safe-area-inset-top));padding-bottom:max(2rem,env(safe-area-inset-bottom))">
    <div class="mb-4 flex items-center justify-between gap-4">
      <p class="text-sm uppercase tracking-widest text-emerald-300/80">Madeira · 1 150 m</p>
      <div id="lang" class="flex shrink-0 overflow-hidden rounded-xl border border-white/15 text-sm" role="group" aria-label="Language">
          <button type="button" data-lang="cs" class="inline-flex items-center gap-1.5 px-3 py-1.5" aria-label="Čeština"><img src="flag-cz.svg" alt="" width="20" height="14" class="h-3.5 w-5 rounded-[2px]">CZ</button>
          <button type="button" data-lang="en" class="inline-flex items-center gap-1.5 px-3 py-1.5" aria-label="English"><img src="flag-gb.svg" alt="" width="20" height="14" class="h-3.5 w-5 rounded-[2px]">EN</button>
        </div>
    </div>
    <nav id="mainnav" class="mb-6 grid grid-cols-5 gap-1 rounded-2xl border border-neutral-800 bg-neutral-900/80 p-1 backdrop-blur-md" aria-label="Navigation">
      <a href="./index.html" data-nav="sun" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm text-neutral-400 hover:text-white hover:bg-white/5"><span aria-hidden="true" class="text-base leading-none">🌅</span><span data-nav-label>Golden Hour</span></a>
      <a href="./escape.html" data-nav="escape" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm text-neutral-400 hover:text-white hover:bg-white/5"><span aria-hidden="true" class="text-base leading-none">☀️</span><span data-nav-label>Sunny Escape</span></a>
      <a href="./fanal.html" data-nav="fanal" aria-current="page" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm bg-neutral-800 text-white ring-1 ring-white/15 shadow-[0_0_14px_rgba(255,255,255,.08)]"><span aria-hidden="true" class="text-base leading-none">🌫️</span><span data-nav-label>Mlžný Fanal</span></a>
      <a href="./webcams.html" data-nav="cams" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm text-neutral-400 hover:text-white hover:bg-white/5"><span aria-hidden="true" class="text-base leading-none">📷</span><span data-nav-label>Webkamery</span></a>
      <a href="./map.html" data-nav="map" class="flex min-h-[44px] flex-col items-center justify-center gap-0.5 rounded-xl px-0.5 py-1.5 text-center text-xs font-medium leading-tight transition-colors sm:flex-row sm:gap-2 sm:text-sm text-neutral-400 hover:text-white hover:bg-white/5"><span aria-hidden="true" class="text-base leading-none">🗺️</span><span data-nav-label>Mapa</span></a>
    </nav>

    <header class="mb-6 flex items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold sm:text-3xl">Fanal Fog Index</h1>
      </div>
      <div id="days" class="hidden shrink-0 overflow-hidden rounded-xl border border-white/15 text-sm" role="group"></div>
    </header>

    <div class="mb-4 flex gap-3 rounded-2xl border border-amber-400/40 bg-amber-400/10 p-4 text-sm text-amber-100" role="note">
      <span aria-hidden="true" class="text-lg leading-none">⚠️</span>
      <div><p id="beta-title" class="font-semibold"></p><p id="beta-text" class="mt-0.5 text-amber-100/90"></p></div>
    </div>

    <div id="state" class="rounded-2xl bg-white/5 p-6 text-slate-300" role="status"></div>

    <section id="content" class="hidden space-y-4">
      <article class="relative overflow-hidden rounded-3xl border border-emerald-300/25 bg-emerald-300/5 p-6 shadow-xl backdrop-blur sm:p-8">
        <div class="mist pointer-events-none absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-zinc-200/10 to-transparent" aria-hidden="true"></div>
        <p id="kicker" class="relative text-xs uppercase tracking-widest text-emerald-200/80"></p>
        <h2 id="status" class="relative mt-1 text-3xl font-bold text-emerald-100 sm:text-4xl"></h2>
        <div class="relative mt-4 h-2 overflow-hidden rounded-full bg-white/10" role="presentation">
          <div id="bar" class="h-full rounded-full bg-emerald-400 transition-all"></div>
        </div>
        <p id="summary" class="relative mt-4 text-slate-200"></p>
        <p id="window" class="relative mt-4 text-xl font-semibold text-emerald-100"></p>
        <ul id="slots" class="relative mt-3 flex flex-wrap gap-2 text-sm"></ul>
      </article>

      <dl class="grid grid-cols-2 gap-3">
        <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
          <dt id="h-hum" class="text-xs uppercase tracking-wider text-slate-400"></dt>

        </div>
        <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
          <dt id="h-base" class="text-xs uppercase tracking-wider text-slate-400"></dt>
          <dd id="v-base" class="mt-1 text-2xl font-semibold"></dd>

        </div>
        <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
          <dt id="h-wind" class="text-xs uppercase tracking-wider text-slate-400"></dt>
          <dd id="v-wind" class="mt-1 text-2xl font-semibold"></dd>
          <p id="n-wind" class="mt-1 text-xs text-slate-500"></p>
        </div>
        <div class="rounded-2xl border border-white/10 bg-white/5 p-4">
          <dt id="h-rain" class="text-xs uppercase tracking-wider text-slate-400"></dt>
          <dd id="v-rain" class="mt-1 text-2xl font-semibold"></dd>
          <p id="n-rain" class="mt-1 text-xs text-slate-500"></p>
        </div>
      </dl>

      <article class="rounded-2xl border border-white/10 bg-white/5 p-5">
        <h2 id="h-gear" class="text-sm uppercase tracking-widest text-slate-400"></h2>
        <ul id="gear" class="mt-3 space-y-1.5 text-slate-200"></ul>
      </article>

      <a id="cam" href="#" target="_blank" rel="noopener" class="block rounded-2xl border border-emerald-300/30 bg-emerald-300/10 px-5 py-4 text-center font-semibold text-emerald-100 transition hover:bg-emerald-300/20"></a>

      <section id="history" class="hidden pt-4">
        <h2 id="h-history" class="text-sm uppercase tracking-widest text-slate-400"></h2>
        <p id="n-history" class="mt-1 text-xs text-slate-500"></p>
        <ul id="history-list" class="mt-3 space-y-2"></ul>
      </section>
    </section>

    <div id="lightbox" class="fixed inset-0 z-[1400] hidden items-center justify-center bg-black/85 p-4" role="dialog" aria-modal="true" aria-labelledby="lb-caption">
      <figure class="relative max-h-full w-full max-w-3xl">
        <img id="lb-img" alt="" class="max-h-[80vh] w-full rounded-xl bg-zinc-900 object-contain">
        <p id="lb-missing" class="hidden rounded-xl bg-zinc-900 p-8 text-center text-slate-400"></p>
        <figcaption id="lb-caption" class="mt-3 text-center text-sm text-slate-300"></figcaption>
        <button id="lb-close" type="button" class="absolute -top-3 right-0 rounded-full bg-slate-800 px-3 py-1 text-slate-200 ring-1 ring-white/20 hover:bg-slate-700" aria-label="Close">✕</button>
      </figure>
    </div>

    <footer class="mt-10 text-xs text-slate-500">
      <p id="updated"></p>
      <p id="disclaimer" class="mt-1"></p>
    </footer>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const T = {
    cs: {
      betaTitle: "Beta verze předpovědi",
      betaText: "Předpověď mlhy pro Fanal je zatím ve zkušebním provozu a nefunguje zcela správně. Neřiď se podle ní; bude se ještě ladit.",
      loading: "Načítám předpověď…",
      today: "Dnes", tomorrow: "Zítra", kicker: "Fanal Fog Index",
      status: { MYSTIC: "🌫️ MYSTICAL FOG", PARTIAL: "🌤️ PARTIAL FOG", CLEAR: "☀️ CLEAR · NO FOG" },
      window: "Doporučený čas návštěvy", noWindow: "Bez výrazné mlhy",
      part: { morning: "Dopoledne", afternoon: "Odpoledne", evening: "Večer" },
      hum: "Vlhkost", base: "Hladina mraků", wind: "Vítr (nárazy)", rain: "Dešťové srážky",
      humNote: (v) => v >= 85 ? "ideální pro mlhu (85–100 %)" : "pod 85 % mlha řídne",
      baseNote: (m, el) => m == null ? "" : m < 900 ? "pod lesem, v lese bude jasno" : m <= 1300 ? "les je přímo uvnitř mraku" : `${m - el} m nad lesem, jen cáry mlhy`,
      windNote: (v) => v <= 50 ? "mlha drží" : "silný vítr mlhu trhá",
      rainNote: (v) => v < 0.2 ? "sucho" : v <= 1.5 ? "jemné mrholení nevadí" : v <= 3 ? "citelný déšť" : "liják, mlhu nečekejte",
      noData: "bez dat", mmh: (v) => `${v.toLocaleString("cs-CZ")} mm/h`,
      gear: "Co s sebou", gearRain: "🧥 Pláštěnka nebo nepromokavá bunda – mlha i mrholení vše promočí",
      gearBoots: "🥾 Nepromokavé boty, v lese je bláto a mokré kameny",
      gearWarm: "🧣 Teplá vrstva navíc, ve 1 150 m je citelně chladněji než u moře",
      gearWind: "💨 Větrovka, nárazy nad 35 km/h",
      gearCam: "📷 Foťák nebo mobil a utěrka na čočku; v mlze vyhrává široký záběr a kontrast stromů",
      gearLight: "🔦 Čelovka, v mlze se rychle setmí",
      cam: "📹 Zkontrolovat živou kameru poblíž", camNote: "Nejbližší kamera: Rabaçal (NetMadeira)",
      history: "Historie mlhy (posledních 7 dní)",
      historyNote: "Skóre z modelových hodnot za 9:00, 13:00 a 17:00; snímky z kamery Rabaçal pomáhají ověřit, jak to dopadlo.",
      photos: "Snímky z kamery", unavailable: "Snímek nedostupný", close: "Zavřít",
      caption: (d, tm) => `Rabaçal webcam · ${d} v ${tm}`,
      mHum: "Relativní vlhkost", mDew: "Rosný bod", mWind: "Vítr", mTemp: "Teplota",
      mSpread: (v) => `rozdíl ${v} °C`,
      dirs: ["S", "SV", "V", "JV", "J", "JZ", "Z", "SZ"],
      histSummary: (e, L) => {
        const m = e.metrics, deg = m.wind_dir;
        const wind = deg == null ? "vítr bez dat" : deg >= 140 && deg <= 220 ? "jižní vítr (föhn)"
          : (deg >= 320 || deg <= 70) ? `pasát (${L.dirs[Math.round(deg / 45) % 8]})` : `vítr ${L.dirs[Math.round(deg / 45) % 8]}`;
        return `Vlhkost ${m.humidity == null ? "?" : m.humidity} %, ${wind} – ${{ MYSTIC: "hustá mlha", PARTIAL: "cáry mlhy", CLEAR: "bez mlhy" }[e.verdict]}`;
      },
      nodata: "Data pro Fanal zatím nejsou k dispozici.",
      error: "Předpověď se nepodařilo načíst", retry: "Zkus to prosím později.",
      updated: "Naposledy aktualizováno", stale: "data jsou starší než den!",
      disclaimer: "Model: Open-Meteo. Základna mraků je odhad z teploty a rosného bodu. Orientační předpověď, ne záruka; zkontroluj kameru.",
    },
    en: {
      betaTitle: "Beta forecast",
      betaText: "The Fanal fog forecast is still in beta and does not work entirely correctly yet. Do not rely on it; it will be tuned further.",
      loading: "Loading forecast…",
      today: "Today", tomorrow: "Tomorrow", kicker: "Fanal Fog Index",
      status: { MYSTIC: "🌫️ MYSTICAL FOG", PARTIAL: "🌤️ PARTIAL FOG", CLEAR: "☀️ CLEAR · NO FOG" },
      window: "Recommended time to visit", noWindow: "No pronounced fog",
      part: { morning: "Morning", afternoon: "Afternoon", evening: "Evening" },
      hum: "Humidity", base: "Cloud base", wind: "Wind (gusts)", rain: "Rainfall",
      humNote: (v) => v >= 85 ? "ideal for fog (85–100 %)" : "below 85 % the fog thins out",
      baseNote: (m, el) => m == null ? "" : m < 900 ? "below the forest, it will be clear up there" : m <= 1300 ? "the forest sits right inside the cloud" : `${m - el} m above the forest, only wisps of fog`,
      windNote: (v) => v <= 50 ? "the fog stays" : "strong wind tears the fog apart",
      rainNote: (v) => v < 0.2 ? "dry" : v <= 1.5 ? "light drizzle is fine" : v <= 3 ? "noticeable rain" : "downpour, forget the fog",
      noData: "no data", mmh: (v) => `${v.toLocaleString("en-GB")} mm/h`,
      gear: "What to bring", gearRain: "🧥 Raincoat or waterproof jacket – fog and drizzle soak everything",
      gearBoots: "🥾 Waterproof shoes, the forest is muddy with wet rocks",
      gearWarm: "🧣 An extra warm layer, it is much cooler at 1,150 m than by the sea",
      gearWind: "💨 Windbreaker, gusts above 35 km/h",
      gearCam: "📷 Camera or phone and a lens cloth; in fog, wide shots and tree contrast win",
      gearLight: "🔦 Headlamp, it gets dark quickly in fog",
      cam: "📹 Check the live webcam nearby", camNote: "Nearest webcam: Rabaçal (NetMadeira)",
      history: "Fog history (last 7 days)",
      historyNote: "Score from model values at 9:00, 13:00 and 17:00; Rabaçal webcam snapshots help check how it turned out.",
      photos: "Webcam snapshots", unavailable: "Snapshot unavailable", close: "Close",
      caption: (d, tm) => `Rabaçal webcam · ${d} at ${tm}`,
      mHum: "Relative humidity", mDew: "Dew point", mWind: "Wind", mTemp: "Temperature",
      mSpread: (v) => `spread ${v} °C`,
      dirs: ["N", "NE", "E", "SE", "S", "SW", "W", "NW"],
      histSummary: (e, L) => {
        const m = e.metrics, deg = m.wind_dir;
        const wind = deg == null ? "no wind data" : deg >= 140 && deg <= 220 ? "southerly wind (foehn)"
          : (deg >= 320 || deg <= 70) ? `trade wind (${L.dirs[Math.round(deg / 45) % 8]})` : `${L.dirs[Math.round(deg / 45) % 8]} wind`;
        return `Humidity ${m.humidity == null ? "?" : m.humidity} %, ${wind} – ${{ MYSTIC: "dense fog", PARTIAL: "patchy fog", CLEAR: "no fog" }[e.verdict]}`;
      },
      nodata: "Fanal data is not available yet.",
      error: "Could not load the forecast", retry: "Please try again later.",
      updated: "Last updated", stale: "data is more than a day old!",
      disclaimer: "Model: Open-Meteo. Cloud base is estimated from temperature and dew point. Indicative forecast, not a guarantee; check the webcam.",
    },
  };
  // české shrnutí posílá backend (d.summary), anglické se skládá ze stejných prahů
  const summaryEn = (d) => d.verdict === "MYSTIC" ? `Dense fog sits right among the trees, ${d.wind_gusts <= 20 ? "light" : "moderate"} wind – bring your camera!`
    : d.verdict === "PARTIAL" ? "Rolling wisps of fog with the odd break."
    : d.rain >= 3 ? "Heavy rain kills the fog and the mood – just wet, not mystical."
    : d.wind_dir_deg != null && d.wind_dir_deg >= 140 && d.wind_dir_deg <= 220 ? "Southerly (foehn) wind dries the air, don't expect fog."
    : d.wind_gusts > 50 ? "Strong wind blows the fog away, no atmosphere today."
    : "Clear or dry – just an ordinary green park without the atmosphere.";
  const ICON = { MYSTIC: "🌫️", PARTIAL: "🌤️", CLEAR: "☀️" };

  let lang = "", data = null, day = null;
  try { lang = localStorage.getItem("lang") || ""; } catch (e) {}
  if (!T[lang]) lang = (navigator.language || "cs").toLowerCase().startsWith("cs") ? "cs" : "en";
  const NAV = { cs: { sun: "Golden Hour", escape: "Sunny Escape", fanal: "Mlžný Fanal", cams: "Webkamery", map: "Mapa" }, en: { sun: "Golden Hour", escape: "Sunny Escape", fanal: "Misty Fanal", cams: "Webcams", map: "Map" } };
  const applyNav = (l) => document.querySelectorAll("#mainnav [data-nav]").forEach((a) => { a.querySelector("[data-nav-label]").textContent = NAV[l][a.dataset.nav]; });
  const t = () => T[lang];
  const locale = () => (lang === "cs" ? "cs-CZ" : "en-GB");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const hh = (h) => `${String(h).padStart(2, "0")}:00`;

  function current() {
    const f = data && data.fanal;
    if (!f) return null;
    if (!day || !f[day]) day = f.day && f[f.day] ? f.day : ["today", "tomorrow"].find((k) => f[k]);
    return day ? { f, d: f[day] } : null;
  }

  function windowText(d) {
    const L = t();
    if (!d.best_window_hours) return L.noWindow;
    const [a, b] = d.best_window_hours;
    return `${a < 12 ? L.part.morning : a < 17 ? L.part.afternoon : L.part.evening} ${hh(a)}–${hh(b)}`;
  }

  function gear(d) {
    const L = t(), items = [];
    if (d.verdict !== "CLEAR" || d.rain >= 0.2) items.push(L.gearRain);
    items.push(L.gearBoots, L.gearWarm);
    if (d.wind_gusts > 35) items.push(L.gearWind);
    if (d.verdict !== "CLEAR") items.push(L.gearCam, L.gearLight);
    return items;
  }

  const open = new Set();  // rozbalené dny přežijí překreslení (např. přepnutí jazyka)
  // formátování v UTC, aby časová zóna prohlížeče nikdy neposunula den
  const dateLabel = (iso) => new Date(iso + "T12:00:00Z").toLocaleDateString(locale(), { weekday: "short", day: "numeric", month: "numeric", timeZone: "UTC" });
  const BADGE = { MYSTIC: "bg-emerald-400/20 text-emerald-200", PARTIAL: "bg-zinc-300/15 text-zinc-200", CLEAR: "bg-amber-300/15 text-amber-200" };

  function openLightbox(e, snap) {
    const L = t(), img = $("lb-img"), miss = $("lb-missing");
    miss.classList.add("hidden");
    img.classList.remove("hidden");
    img.onerror = () => { img.classList.add("hidden"); miss.textContent = L.unavailable; miss.classList.remove("hidden"); };
    img.alt = L.caption(dateLabel(e.date), snap.time);
    img.src = snap.url;
    $("lb-caption").textContent = L.caption(dateLabel(e.date), snap.time);
    $("lb-close").setAttribute("aria-label", L.close);
    $("lightbox").classList.remove("hidden");
    $("lightbox").classList.add("flex");
    $("lb-close").focus();
  }
  function closeLightbox() {
    $("lightbox").classList.add("hidden");
    $("lightbox").classList.remove("flex");
    $("lb-img").removeAttribute("src");  // zastaví případné dotahování
  }
  $("lb-close").addEventListener("click", closeLightbox);
  $("lightbox").addEventListener("click", (ev) => { if (ev.target === $("lightbox")) closeLightbox(); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeLightbox(); });

  // Dostupnost snímku se ověřuje až po rozbalení dne a asynchronně, takže stránku nikdy neblokuje.
  function snapshotButton(e, snap) {
    const L = t(), b = el("button", "rounded-xl border border-white/15 bg-white/5 px-4 py-2 text-sm text-slate-200 transition hover:bg-white/10", `📷 ${snap.time}`);
    b.type = "button";
    b.addEventListener("click", () => openLightbox(e, snap));
    const probe = new Image();
    probe.onerror = () => {
      const gone = el("span", "rounded-xl border border-white/5 px-4 py-2 text-sm text-slate-500", `${snap.time} · ${L.unavailable}`);
      b.replaceWith(gone);
    };
    probe.src = snap.url;
    return b;
  }

  function historyRow(e) {
    const L = t(), m = e.metrics, li = el("li", "overflow-hidden rounded-2xl border border-white/10 bg-white/5");
    const head = el("button", "flex w-full items-center justify-between gap-3 p-4 text-left");
    head.type = "button";
    const isOpen = open.has(e.date);
    head.setAttribute("aria-expanded", isOpen);
    head.append(
      el("span", "min-w-0 flex-1 font-semibold", dateLabel(e.date)),
      el("span", "shrink-0 rounded-full px-2.5 py-0.5 text-xs font-semibold " + (BADGE[e.verdict] || ""), `${ICON[e.verdict] || ""} ${e.verdict}`),
      el("span", "w-12 shrink-0 text-right text-lg font-bold text-emerald-100", `${e.score} %`));
    const body = el("div", "border-t border-white/10 p-4" + (isOpen ? "" : " hidden"));
    body.append(el("p", "text-sm text-slate-300", lang === "cs" ? e.summary : L.histSummary(e, L)));
    const grid = el("dl", "mt-3 grid grid-cols-2 gap-2 text-sm sm:grid-cols-4");
    const cell = (k, v, sub) => {
      const d = el("div", "rounded-xl bg-black/20 p-3");
      d.append(el("dt", "text-[11px] uppercase tracking-wider text-slate-400", k), el("dd", "mt-0.5 font-semibold", v));
      if (sub) d.append(el("p", "text-xs text-slate-500", sub));
      return d;
    };
    const n = (v, u) => (v == null ? "–" : `${v.toLocaleString(locale())} ${u}`);
    const dir = m.wind_dir == null ? "" : ` ${L.dirs[Math.round(m.wind_dir / 45) % 8]}`;
    grid.append(
      cell(L.mHum, n(m.humidity, "%")),
      cell(L.mDew, n(m.dew_point, "°C"), m.dew_point_spread == null ? "" : L.mSpread(m.dew_point_spread.toLocaleString(locale()))),
      cell(L.mWind, m.wind_speed == null ? "–" : `${m.wind_speed} km/h${dir}`),
      cell(L.mTemp, n(m.temp, "°C")));
    body.append(grid);
    const photos = el("div", "mt-3");
    photos.append(el("p", "mb-2 text-xs uppercase tracking-wider text-slate-400", L.photos));
    const row = el("div", "flex flex-wrap gap-2");
    let loaded = false;
    const fill = () => { if (!loaded) { loaded = true; row.replaceChildren(...(e.snapshots || []).map((sn) => snapshotButton(e, sn))); } };
    photos.append(row);
    body.append(photos);
    if (isOpen) fill();
    head.addEventListener("click", () => {
      const now = body.classList.toggle("hidden") === false;
      head.setAttribute("aria-expanded", now);
      if (now) { open.add(e.date); fill(); } else open.delete(e.date);
    });
    li.append(head, body);
    return li;
  }

  function renderHistory(f) {
    const L = t(), hist = (f.history || []);
    $("history").classList.toggle("hidden", !hist.length);
    $("h-history").textContent = L.history;
    $("n-history").textContent = L.historyNote;
    $("history-list").replaceChildren(...hist.map(historyRow));
  }

  function render() {
    const L = t(), cur = current();
    document.documentElement.lang = lang;
    applyNav(lang);
    $("beta-title").textContent = L.betaTitle;
    $("beta-text").textContent = L.betaText;
    $("disclaimer").textContent = L.disclaimer;
    document.querySelectorAll("#lang button").forEach((b) => {
      const on = b.dataset.lang === lang;
      b.setAttribute("aria-pressed", on);
      b.className = "inline-flex items-center gap-1.5 px-3 py-1.5 " + (on ? "seg-on" : "seg-off");
    });
    if (!data) { $("state").textContent = L.loading; return; }
    if (data.generated_at) {
      const g = new Date(data.generated_at), stale = (Date.now() - g.getTime()) / 36e5 > 24;
      $("updated").textContent = `${L.updated}: ${g.toLocaleString(locale(), { dateStyle: "medium", timeStyle: "short", timeZone: "Atlantic/Madeira" })}` + (stale ? ` – ${L.stale}` : "");
      $("updated").className = stale ? "text-amber-400" : "";
    }
    if (!cur) {
      $("content").classList.add("hidden");
      $("state").classList.remove("hidden");
      $("state").textContent = L.nodata;
      return;
    }
    $("state").classList.add("hidden");
    $("content").classList.remove("hidden");

    const { f, d } = cur, elev = (f.location && f.location.elevation_m) || 1150;
    const keys = ["today", "tomorrow"].filter((k) => f[k]);
    $("days").classList.toggle("hidden", keys.length < 2);
    $("days").classList.toggle("flex", keys.length >= 2);
    $("days").replaceChildren(...keys.map((k) => {
      const b = el("button", "px-3 py-1.5 " + (k === day ? "seg-on" : "seg-off"), L[k]);
      b.type = "button";
      b.setAttribute("aria-pressed", k === day);
      b.addEventListener("click", () => { day = k; render(); });
      return b;
    }));

    $("kicker").textContent = L.kicker;
    $("status").textContent = `${L.status[d.verdict] || d.verdict} · ${d.score} %`;
    $("bar").style.width = `${Math.max(0, Math.min(100, d.score))}%`;
    $("summary").textContent = lang === "cs" ? d.summary : summaryEn(d);
    $("window").textContent = d.best_window_hours ? `${L.window}: ${windowText(d)}` : windowText(d);
    $("slots").replaceChildren(...(d.slots || []).map((s) =>
      el("li", "rounded-full px-3 py-1 text-slate-200 " + (s.hour === d.peak_hour ? "bg-emerald-400/20 ring-1 ring-emerald-300/40" : "bg-black/25"),
        `${hh(s.hour)} ${ICON[s.verdict] || ""} ${s.score} %`)));

    const num = (v, unit) => (v == null ? L.noData : `${v.toLocaleString(locale())} ${unit}`);
    $("h-hum").textContent = L.hum;
    $("v-hum").textContent = num(d.humidity, "%");
    $("n-hum").textContent = d.humidity == null ? "" : L.humNote(d.humidity);
    $("h-base").textContent = L.base;
    $("v-base").textContent = num(d.cloud_base_m, "m");
    $("n-base").textContent = L.baseNote(d.cloud_base_m, elev);
    $("h-wind").textContent = L.wind;
    $("v-wind").textContent = num(d.wind_gusts, "km/h");
    const dirTxt = d.wind_dir_deg == null || d.wind_speed == null ? "" : `${L.dirs[Math.round(d.wind_dir_deg / 45) % 8]} ${d.wind_speed} km/h · `;
    $("n-wind").textContent = dirTxt + L.windNote(d.wind_gusts);
    $("h-rain").textContent = L.rain;
    $("v-rain").textContent = d.rain == null ? L.noData : L.mmh(d.rain);
    $("n-rain").textContent = d.rain == null ? "" : L.rainNote(d.rain);

    $("h-gear").textContent = L.gear;
    $("gear").replaceChildren(...gear(d).map((g) => el("li", "", g)));
    const cam = $("cam");
    cam.textContent = L.cam;
    cam.title = L.camNote;
    if (f.webcam_url) cam.href = f.webcam_url; else cam.classList.add("hidden");
    renderHistory(f);
  }

  document.querySelectorAll("#lang button").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch (e) {}
    render();
  }));
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }

  fetch("./data.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then((d) => { data = d; render(); })
    .catch((e) => {
      $("state").textContent = `${t().error} (${e.message}). ${t().retry}`;
      $("state").className = "rounded-2xl bg-rose-500/10 p-6 text-rose-200 ring-1 ring-rose-400/30";
    });
})();
</script>
</body>
</html>
