# Váhy a prahy skóre. Výchozí hodnoty jsou odhad; kalibrace přijde v Phase 2.
sunrise:
  weights:
    sky: 0.45          # volná obloha nad vrcholem a na východním obzoru
    color: 0.15        # střední/vysoká oblačnost pro barvy
    visibility: 0.25   # dohlednost, žádná mlha
    wind: 0.15
    cloudsea: 0.0      # moře mraků je neutrální (viz ARCHITECTURE.md 0.1); >0 = preferuj inverzi
  verdict:
    go: 70
    maybe: 45
  window:
    before_min: 60
    after_min: 30
  fog:                     # viz FogConfig; kalibrováno na 8 dnech (5.–12. 10. 2026), hlídá regresní test
    summit_rh_clear: 70    # RH ve výšce vrcholu (interpolace 850/800 hPa) pod tímto = bez mlhy
    summit_rh_fog: 90      # nad tímto = vrchol v mraku
    aloft_dry_rh: 40       # RH v 800 hPa pod tímto = suchý vzduch nad vrstvou → přízemní vlhkost se ignoruje
    aloft_moist_rh: 65     # nad tímto = přízemní vlhkost/dohlednost je důvěryhodná
    gate_strength: 0.85
inversion:
  weights:
    stability: 0.30
    moisture: 0.25
    above_deck: 0.30
    lowland: 0.15
# Vyhlídková místa (souřadnice a výšky jsou v locations.yaml pod stejným klíčem).
spots:
  arieiro:
    name: "Pico do Arieiro"
    type: mountain_inversion
    departure_from_funchal_min: 80
    webcam_url: "https://www.netmadeira.com/webcams-madeira/pico-do-arieiro"
  bica_da_cana:
    name: "Miradouro da Bica da Cana"
    type: mountain_inversion
    departure_from_funchal_min: 70
  ponta_do_pargo:
    name: "Farol da Ponta do Pargo"
    type: coastal_sunset
    departure_from_funchal_min: 65
    webcam_url: "https://www.netmadeira.com/webcams-madeira/ponta-do-pargo"
  pico_ruivo:               # nejvyšší vrchol (1862 m), stejný model inverze jako Arieiro (800 hPa)
    name: "Pico Ruivo"
    type: mountain_inversion
    departure_from_funchal_min: 120   # ~60 min jízda na Achada do Teixeira + 45 min pěšky + rezerva
  ponta_do_rosto:
    name: "Miradouro da Ponta do Rosto"
    type: coastal_sunrise
    departure_from_funchal_min: 50    # ~35 min jízda + parkování a chůze + rezerva
  cristo_rei:
    name: "Miradouro do Cristo Rei"
    type: coastal_sunset
    departure_from_funchal_min: 25    # ~15 min jízda + chůze + rezerva
# Východ na útesu Ponta do Rosto: východní obzor nad mořem musí být čistý, vítr na útesu mírný.
coastal_sunrise:
  max_horizon_low_clouds: 20   # nad tímto (%) nízké mraky na východě zakrývají slunce
  max_gusts_kmh: 40            # nárazy nad tímto na útesu srážejí skóre
  weights:
    horizon_clarity: 0.45
    cloud_canvas: 0.25
    visibility: 0.15
    wind: 0.15
# Bica da Cana leží v 1560 m (≈ hladina 850 hPa), tedy pod Arieirem (1818 m): vrchol musí být nad
# mraky už v ~1400 m, jinak se přelijí přes plošinu Paul da Serra. Východ se skóruje stejnou
# heuristikou jako Arieiro (sunrise.*), tyto hodnoty ji jen posouvají.
bica_da_cana:
  inversion:
    target_cloud_top_max: 1400   # horní hranice mraků nejvýš 1400 m (≥ 160 m pod vrcholem)
    peak_rh_max: 70              # RH ve výšce vrcholu pod tímto = bez mlhy (jinak roste pravděpodobnost mraku)
    dry_layer_hpa: 850           # dělící hladina pro "sucho nad vrstvou" (u Arieira 800 hPa)
  wind:
    max_gusts_kmh: 30            # Paul da Serra je větrnější → práh nárazů bez srážení skóre +5 km/h
# Západ slunce na Ponta do Pargo: čistý obzor nízkých mraků + střední/vysoká oblačnost jako plátno.
sunset:
  window:
    before_min: 45             # okno dat kolem západu; barvy vrcholí až po západu slunce
    after_min: 15
  verdict:
    go: 70
    maybe: 45
  gates:
    max_precipitation_mm: 0.1  # déšť = NO-GO
    max_horizon_low_clouds: 30 # nad tímto (%) nízké mraky na západě zakrývají slunce → skóre klesá
    min_visibility_m: 15000    # pod tímto se skóre sráží (na 1/3 prahu ×0.3)
  weights:
    horizon_clarity: 0.40      # čistý obzor nad mořem
    cloud_canvas: 0.35         # střední/vysoká oblačnost pro barvy
    low_cloud_penalty: 0.15    # mlha/mrak přímo na vyhlídce (312 m)
    wind_comfort: 0.10         # na útesu je nad ~45 km/h nepříjemně
  piecewise:
    # [pokrytí %, skóre 0–100]: bez mraků obyčejný západ (50), 35 % nejbarevnější (100), >85 % zataženo
    canvas_clouds:
      - [0, 50]
      - [15, 80]
      - [35, 100]
      - [55, 90]
      - [70, 40]
      - [85, 0]
    # nízká oblačnost na západním obzoru [%, skóre 0–100]
    horizon_low_clouds:
      - [0, 100]
      - [15, 90]
      - [25, 60]
      - [40, 20]
      - [60, 0]
bot:
  digest_time: "20:00"        # večerní digest (místní čas Madeiry)
  feedback_time: "10:00"      # dotaz "jak dopadl východ?"
  departure_before_min: 80    # odjezd z Funchalu před východem
  compare_from: "13:00"
  compare_to: "18:00"

# Sunny Escape: nejslunnější pobřežní místo, když prší nebo je zataženo ve Funchalu / v horách.
sunny_escape:
  hour_from: 11              # okno hodnocení (místní čas); 16 = bez konce, tedy hodiny 11–15
  hour_to: 16
  points:
    - {key: ponta_do_sol, name: "Ponta do Sol",            lat: 32.6806, lon: -17.1042, elevation_m: 20}  # JZ, statisticky nejslunnější
    - {key: calheta,      name: "Calheta / Jardim do Mar", name_gen: "Calhety / Jardim do Mar", lat: 32.7214, lon: -17.1742, elevation_m: 15}  # západ
    - {key: machico,      name: "Machico", name_gen: "Machica", lat: 32.7183, lon: -16.7644, elevation_m: 10}  # východ
    - {key: sao_vicente,  name: "São Vicente",             lat: 32.8028, lon: -17.0436, elevation_m: 30}  # sever, deštivější (kontrast)
    - {key: funchal,      name: "Funchal", name_gen: "Funchalu", lat: 32.6500, lon: -16.9086, elevation_m: 50}  # referenční základna
  weights:
    sunshine: 0.40           # bonus za slunce (sunshine duration, jinak přímé záření)
    clouds: 0.40             # penalizace oblačnosti: hlavně nízká a střední
    temperature: 0.20        # bonus za příjemnou teplotu
  cloud_mix: {low: 0.45, mid: 0.35, high: 0.20}
  max_radiation_wm2: 700     # záloha: přímé záření odpovídající plnému slunci
  temperature_curve:         # [průměrná °C v okně, skóre 0–1]
    - [14, 0.0]
    - [18, 0.4]
    - [22, 0.85]
    - [25, 1.0]
    - [28, 1.0]
    - [33, 0.6]
  rain_min_mm: 0.1           # úhrn v okně od tohoto = srážky → skóre se prudce srazí
  rain_base_factor: 0.5      # ... na tento násobek
  rain_per_mm: 0.15          # ... a dál o tolik za každý mm

# Fanal Forest: obrácená logika než hory. Hledáme hustou mlhu a nízký mrak, ale ne vichr a liják.
# Skóre = vážený součet (vlhkost, základna mraků, dohlednost) × brána srážek × brána nárazů.
fanal:
  name: "Fanal Forest"
  type: fog_seeker
  lat: 32.8083
  lon: -17.1417
  elevation_m: 1150
  # NetMadeira nemá kameru přímo na Fanalu ani Paul da Serra; nejbližší je Rabaçal (stejná výška, ~8 km)
  webcam_url: "https://www.netmadeira.com/webcams-madeira/rabacal-madeira"
  slot_hours: [9, 13, 17]     # denní sloty (místní čas)
  window_from: 8              # nejlepší okno se hledá v hodinách 8–18 (včetně)
  window_to: 18
  cloud_base_m_per_c: 125     # základna mraků nad zemí ≈ 125 m za každý °C rozdílu T − rosný bod
  weights:
    humidity: 0.40
    cloud_base: 0.35
    visibility: 0.25
  verdict:
    go: 70                    # MYSTIC
    maybe: 40                 # PARTIAL; pod tím CLEAR
  curves:                     # [vstup, skóre 0–1]
    humidity:                 # RH [%]; 85–100 % = maximum
      - [60, 0]
      - [85, 1]
      - [100, 1]
    cloud_base:               # m n. m.; 900–1300 = les je uvnitř mraku
      - [700, 0]
      - [900, 1]
      - [1300, 1]
      - [1600, 0.3]
      - [2000, 0]
    visibility:               # m; <400 ideál, <1000 dobré
      - [400, 1]
      - [1000, 0.6]
      - [3000, 0.1]
      - [10000, 0]
    precip:                   # mm/h; mrholení do 1,5 nevadí, nad 3 skóre k nule
      - [1.5, 1]
      - [3, 0]
    gusts:                    # km/h; nad 35 vichr trhá mlhu
      - [35, 1]
      - [60, 0.2]
