# Webkamery NetMadeira pro docs/webcams.html. Všechny slugy ověřeny proti timelapse snímkům (HTTP 200).
# snapshot_url: {day} = YYYY-MM-DD, {slot} = HH_MM (půlhodinové sloty, místní čas Madeiry).
# category: mountain | forest | sunset | coast. spot_id: klíč spotu předpovědi (arieiro, ponta_do_rosto, ...) nebo fanal.
# Nadmořské výšky jsou přibližné. Kamery Encumeada, Bica da Cana, Paul da Serra, São Vicente, Paul do Mar,
# Calheta a Funchal-Marina NetMadeira nenabízí; nahrazeny nejbližšími existujícími.
webcams:
  # Hory & inverze
  - {id: pico-do-arieiro,    name: Pico do Arieiro,    altitude_m: 1818, category: mountain, spot_id: arieiro,
     snapshot_url: "https://www.netmadeira.com/assets/images/services/webcams/timelapses/netmadeira/pico-do-arieiro/{day}/{slot}.jpg",
     live_url: "https://www.netmadeira.com/webcams-madeira/pico-do-arieiro"}
  - {id: achada-do-teixeira, name: Achada do Teixeira, altitude_m: 1590, category: mountain,
     snapshot_url: "https://www.netmadeira.com/assets/images/services/webcams/timelapses/netmadeira/achada-do-teixeira/{day}/{slot}.jpg",
     live_url: "https://www.netmadeira.com/webcams-madeira/achada-do-teixeira"}
  - {id: eira-do-serrado,    name: Eira do Serrado,    altitude_m: 1094, category: mountain,
     snapshot_url: "https://www.netmadeira.com/assets/images/services/webcams/timelapses/netmadeira/eira-do-serrado/{day}/{slot}.jpg",
     live_url: "https://www.netmadeira.com/webcams-madeira/eira-do-serrado"}
  # Mlžný les & vnitrozemí
  - {id: rabacal,            name: Rabaçal,            altitude_m: 1050, category: forest, spot_id: fanal,
     snapshot_url: "https://www.netmadeira.com/assets/images/services/webcams/timelapses/netmadeira/rabacal-madeira/{day}/{slot}.jpg",
     live_url: "https://www.netmadeira.com/webcams-madeira/rabacal-madeira"}
  - {id: santo-da-serra,     name: Santo da Serra,     altitude_m: 660,  category: forest,
     snapshot_url: "https://www.netmadeira.com/assets/images/services/webcams/timelapses/netmadeira/santo-da-serra-golf/{day}/{slot}.jpg",
     live_url: "https://www.netmadeira.com/webcams-madeira/santo-da-serra-golf"}
  - {id: monte,              name: Monte,              altitude_m: 560,  category: forest,
     snapshot_url: "https://www.netmadeira.com/assets/images/services/webcams/timelapses/netmadeira/monte/{day}/{slot}.jpg",
     live_url: "https://www.netmadeira.com/webcams-madeira/monte"}
  # Západ slunce (jih a jihozápad)
